<main>
  <div class="container">
    <h1 class="title">Últimas postagens</h1>
    <section class="posts">

      @for (post of posts; track post.id) {
        <article class="post">
          <a [routerLink]="['/posts', post.id]">
            <h2>{{ post.title }}</h2>
            <span>
              {{ post.createdAt | date:'dd/MM/yyyy' }}
            </span>
          </a>
        </article>
      }
    </section>
  </div>
</main>
