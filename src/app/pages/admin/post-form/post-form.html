<main>
  <div class="container">

    <section class="post-form">

      <h1>Novo post</h1>

      <form (ngSubmit)="createPost()">

        <div>
          <label for="title">Título</label>

          <input
            id="title"
            type="text"
            name="title"
            [(ngModel)]="post.title"
            required
          >
        </div>

        <div>
          <label for="content">Conteúdo</label>

          <textarea
            id="content"
            name="content"
            [(ngModel)]="post.content"
            rows="10"
            required
          ></textarea>
        </div>

        <button type="submit">
          Criar post
        </button>

      </form>

    </section>

  </div>
</main>
